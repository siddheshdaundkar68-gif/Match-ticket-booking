 for(let s=0;s<NS;s++){const a=s*2;i2.push(a,a+1,a+2,a+1,a+3,a+2)}g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(i2);g.computeVertexNormals();return g})(),new THREE.MeshStandardMaterial({color:0xdadde0,roughness:.6,side:THREE.DoubleSide}));

[[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([a,b])=>{const m=mk(new THREE.CylinderGeometry(.7,1,46,10),0xc9ccd0);m.position.set(a*(A+42)*.74,23,b*(B+42)*.74);m.castShadow=true;scene.add(m);
 const h=mk(new THREE.BoxGeometry(9,4,2),0xeeeeee);h.position.set(m.position.x,47,m.position.z);scene.add(h)});

let sd=11;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const tg=new THREE.ConeGeometry(2.6,8,7);tg.translate(0,5.5,0);
const trees=new THREE.InstancedMesh(tg,new THREE.MeshStandardMaterial({roughness:1}),520),dm=new THREE.Object3D();
for(let i=0;i<520;){const x=(rnd()-.5)*640,z=(rnd()-.5)*640;if((x/(A+72))**2+(z/(B+72))**2<1)continue;
 dm.position.set(x,0,z);dm.scale.setScalar(.8+rnd()*.9);dm.updateMatrix();trees.setMatrixAt(i,dm.matrix);trees.setColorAt(i,new THREE.Color().setHSL(.3+rnd()*.05,.5,.18+rnd()*.1));i++}

const box=(w,h,d,x,y,z)=>{const g=new THREE.BoxGeometry(w,h,d);g.translate(x,y,z);return g};

 gs.forEach(g=>{p.push(...g.attributes.position.array);n.push(...g.attributes.normal.array);i.push(...Array.from(g.index.array,k=>k+o));o+=g.attributes.position.count});

const seats=[],left=new Array(NB*2).fill(0);sd=7;
for(let t=0;t<2;t++)for(let rb=0;rb<NB;rb++)for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
 const th=TH0+(rb+.04+.92*(c+.5)/COLS)*TAU/NB,d=T[t].d0+(r+.5)*T[t].dk,y=T[t].y0+r*T[t].rise;
 const nx=Math.cos(th)/(A+d),nz=Math.sin(th)/(B+d),l=Math.hypot(nx,nz),sp=Math.hypot((A+d)*Math.sin(th),(B+d)*Math.cos(th))*TAU/NB*.92/COLS;
 const s={x:(A+d)*Math.cos(th),y,z:(B+d)*Math.sin(th),rot:Math.atan2(-nx/l,-nz/l),w:Math.min(1.4,sp*.78),blk:t*NB+rb,r,c,taken:rnd()<.35,v:.85+rnd()*.3};
 if(!s.taken)left[s.blk]++;seats.push(s)}
const sm=new THREE.InstancedMesh(sg,new THREE.MeshStandardMaterial({roughness:.5}),seats.length);
seats.forEach((s,i)=>{dm.position.set(s.x,s.y,s.z);dm.rotation.set(0,s.rot,0);dm.scale.set(s.w,1,1);dm.updateMatrix();sm.setMatrixAt(i,dm.matrix)});
dm.rotation.set(0,0,0);dm.scale.setScalar(1);sm.castShadow=sm.receiveShadow=true;sm.frustumCulled=false;scene.add(sm);
// live screens (animated demo clip)
const sc=document.createElement('canvas');sc.width=320;sc.height=180;const sx=sc.getContext('2d'),stex=new THREE.CanvasTexture(sc);stex.encoding=THREE.sRGBEncoding;
function drawScreen(t){sx.fillStyle='#2f8f3f';sx.fillRect(0,0,320,180);sx.fillStyle='#37a246';for(let i=0;i<8;i+=2)sx.fillRect(i*40,0,40,180);
 sx.strokeStyle='#fff';sx.lineWidth=2;sx.strokeRect(10,10,300,160);sx.beginPath();sx.moveTo(160,10);sx.lineTo(160,170);sx.stroke();sx.beginPath();sx.arc(160,90,24,0,TAU);sx.stroke();
 sx.fillStyle='#fff';sx.beginPath();sx.arc(160+Math.sin(t*1.3)*110,92+Math.sin(t*2.1)*48,7,0,TAU);sx.fill();
 sx.fillStyle='#e5322d';sx.fillRect(12,12,48,18);sx.fillStyle='#fff';sx.font='700 12px sans-serif';sx.fillText('LIVE',20,26)}
drawScreen(0);
const scrM=new THREE.MeshBasicMaterial({map:stex,toneMapped:false});
for(let i=0;i<8;i++){const th=TH0+(i+.5)*TAU/8,m=new THREE.Mesh(new THREE.PlaneGeometry(11,6.2),scrM),d=17.6;
 const nx=Math.cos(th)/(A+d),nz=Math.sin(th)/(B+d),l=Math.hypot(nx,nz);m.position.set((A+d)*Math.cos(th),7.4,(B+d)*Math.sin(th));m.rotation.y=Math.atan2(-nx/l,-nz/l);scene.add(m)}

const cam={p:new V3(),t:new V3()},orb={yaw:.55,pitch:.85,dist:235},view={yaw:0,pitch:0};

  SEAT:'Upgrade to a skybox, or keep your seat to see the view',VIEW:'Drag to look around'}[mode]}
function fillTicket(){const s=seats[sel.seat],i=info(s.blk);$('tTier').textContent=STANDS[i.st]+' Stand · '+(sel.sky?'Skybox':i.tier);$('tBlock').textContent='Block '+i.no;
 $('tRow').textContent=s.r+1;$('tSeat').textContent=s.c+1;$('tGate').textContent=STANDS[i.st][0]+(1+(i.rb&3));$('tPrice').textContent=i.price+(sel.sky?195:0);
 $('up').textContent=sel.sky?'Skybox selected':'Upgrade · +€195'}
$('back').onclick=goBack;
$('up').onclick=()=>{sel.sky=true;fillTicket();goView()};$('keep').onclick=()=>{sel.sky=false;goView()};
$('other').onclick=()=>goBlock(sel.blk);
$('confirm').onclick=()=>{const s=seats[sel.seat],i=info(s.blk);$('doneTxt').textContent=STANDS[i.st]+' Stand · Block '+i.no+' · Row '+(s.r+1)+' · Seat '+(s.c+1)+(sel.sky?' · Skybox':'')+' — €'+(i.price+(sel.sky?195:0))+'. AMS United vs Maas City FC, Sat 23 May, 20:00.';$('done').classList.add('on')};
$('again').onclick=()=>{$('done').classList.remove('on');goAerial()};
// picking
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
 if(mode==='BLOCK'){let best=-1,bd=1e9;for(let i=sel.blk*PER;i<(sel.blk+1)*PER;i++){const s=seats[i];if(s.taken)continue;const c=new V3(s.x,s.y+.6,s.z),d=ray.ray.distanceSqToPoint(c);
  if(d<.4&&ray.ray.origin.distanceToSquared(c)<bd){bd=ray.ray.origin.distanceToSquared(c);best=i}}return best<0?null:{seat:best}}
 if(mode==='SEAT'||mode==='VIEW')return null;
 const h=ray.intersectObject(ringMesh)[0];if(!h)return null;
 if((h.point.x/(A+35))**2+(h.point.z/(B+35))**2>.97)return null;
 const rb=Math.floor(Math.floor(h.faceIndex/FPS)%NS/8),t=h.point.y>10.7?1:0,st=rb>>2;
 if(mode==='AERIAL')return{stand:st};
 return st===sel.stand?{blk:t*NB+rb}:null}
const same=p=>p&&((p.seat!==undefined&&p.seat===hv.seat)||(p.blk!==undefined&&p.blk===hv.blk)||(p.stand!==undefined&&p.stand===hv.stand));
function setHover(p,e){const n={stand:p&&p.stand!==undefined?p.stand:-1,blk:p&&p.blk!==undefined?p.blk:-1,seat:p&&p.seat!==undefined?p.seat:-1};
 const ch=n.stand!==hv.stand||n.blk!==hv.blk||n.seat!==hv.seat;hv=n;const c=$('chip');
 if(!p){c.style.display='none';cv.style.cursor='default'}else{let h='';
  if(n.stand>=0){let l=0;for(let b=0;b<NB*2;b++)if(info(b).st===n.stand)l+=left[b];h=STANDS[n.stand]+' Stand<span>From €'+Math.min(LOWP[n.stand],UPP[n.stand])+' · '+l+' seats left</span>'}
  else if(n.blk>=0){const i=info(n.blk);h='Block '+i.no+' · '+i.tier+'<span>€'+i.price+' · '+left[n.blk]+' seats left</span>'}
  else{const s=seats[n.seat];h='Row '+(s.r+1)+' · Seat '+(s.c+1)+'<span>€'+info(s.blk).price+'</span>'}
  c.innerHTML=h;c.style.display='block';c.style.left=Math.min(e.clientX+14,innerWidth-190)+'px';c.style.top=Math.min(e.clientY+14,innerHeight-70)+'px';cv.style.cursor='pointer'}
 if(ch)paint()}
function act(p){if(mode==='AERIAL'&&p.stand!==undefined)goStand(p.stand);else if(mode==='STAND'&&p.blk!==undefined)goBlock(p.blk);else if(mode==='BLOCK'&&p.seat!==undefined)goSeat(p.seat)}
const ptrs=new Map();let drag=null,pinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={m:0}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);
 if(!p){if(e.pointerType==='mouse'&&!fl)setHover(pick(e),e);return}
 const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;drag.m+=Math.abs(dx)+Math.abs(dy);
 if(ptrs.size===2){const[a,b]=[...ptrs.values()],dd=Math.hypot(a.x-b.x,a.y-b.y);if(pinch&&mode==='AERIAL'){orb.dist*=pinch/dd;clampOrb()}pinch=dd;return}
 if(fl)return;
 if(mode==='AERIAL'){orb.yaw-=dx*.005;orb.pitch+=dy*.004;clampOrb()}
 else if(mode==='VIEW'){view.yaw=Math.max(-1.6,Math.min(1.6,view.yaw+dx*.004));view.pitch=Math.max(-.6,Math.min(.6,view.pitch-dy*.003));dirty=true}});
const up=e=>{const tap=drag&&drag.m<8&&ptrs.size===1&&e.type==='pointerup';ptrs.delete(e.pointerId);pinch=0;
 if(tap&&!fl){const p=pick(e);if(!p){setHover(null,e);return}if(e.pointerType==='mouse'||same(p))act(p);else setHover(p,e)}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{if(mode==='AERIAL'){e.preventDefault();orb.dist*=1+e.deltaY*.001;clampOrb()}},{passive:false});
// render loop
const cam2=new THREE.PerspectiveCamera(75,1,.1,1200),tctx=$('tCan').getContext('2d');
function snap(){const s=seats[sel.seat];cam2.aspect=camera.aspect;cam2.updateProjectionMatrix();cam2.position.copy(eye(s,false));cam2.lookAt(0,1,0);R.render(scene,cam2);
 const W=cv.width,H=cv.height;let sw=W,sh=W/1.5;if(sh>H){sh=H;sw=H*1.5}tctx.drawImage(cv,(W-sw)/2,(H-sh)/2,sw,sh,0,0,360,240)}
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();dirty=true}
addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>dirty=true);addEventListener('focus',()=>dirty=true);addEventListener('pageshow',()=>dirty=true);
cv.addEventListener('webglcontextlost',e=>e.preventDefault());cv.addEventListener('webglcontextrestored',()=>{R.shadowMap.needsUpdate=true;dirty=true});
let lastDraw=0;
function tick(now){requestAnimationFrame(tick);
 if(fl){const u=Math.min(1,(now-fl.s)/fl.d),e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;cam.p.lerpVectors(fl.p0,fl.p1,e);cam.t.lerpVectors(fl.t0,fl.t1,e);
  camera.fov=fl.f0+(fl.f1-fl.f0)*e;camera.updateProjectionMatrix();if(u>=1){fl=null;if(mode==='AERIAL')orbDirty=true}dirty=true}
 else if(orbDirty&&mode==='AERIAL'){cam.p.copy(orbPos());cam.t.set(0,0,0);orbDirty=false}
 if(!dirty&&now-lastDraw<1000)return;dirty=false;lastDraw=now;
 camera.position.copy(cam.p);
 if(mode==='VIEW'&&!fl){const d=cam.t.clone().sub(cam.p).normalize().applyAxisAngle(UP,view.yaw);d.y+=view.pitch;camera.lookAt(cam.p.clone().add(d))}else camera.lookAt(cam.t);
 if(snapPending){snapPending=false;snap()}
 R.render(scene,camera)}
resize();cam.p.copy(orbPos());cam.t.set(0,0,0);cam.p.multiplyScalar(1.6);flyTo(orbPos(),new V3(),45,2200);ui();paint();requestAnimationFrame(tick);
})();
</script></body></html>
